name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # api импортирует @lifeos/contracts из dist — собираем до типов и тестов.
      - run: pnpm --filter @lifeos/contracts build
      # Временно: полный отчёт линтера уходит комментарием в запрос на слияние,
      # потому что аннотации показывают только первые десять замечаний.
      - name: Lint report
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pnpm exec eslint . --format unix > lint-report.txt 2>&1 || true
          { echo '```'; head -c 60000 lint-report.txt; echo '```'; } > lint-comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file lint-comment.md
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Database start report
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! supabase db start > db-start.txt 2>&1; then
            { echo 'supabase db start failed:'; echo '```'; tail -c 6000 db-start.txt; echo '```'; } > db-comment.md
            gh pr comment ${{ github.event.pull_request.number }} --body-file db-comment.md
          fi
          supabase stop --no-backup > /dev/null 2>&1 || true
      - run: supabase db start
      - run: supabase db reset --local
      - run: supabase test db
