name: CI

# Проверки PR. Пуш в main проверяет и выкатывает Deploy — второй раз не гоняем.
# Изменения только в iOS и документации Linux-проверки не затрагивают.
on:
  pull_request:
    paths-ignore:
      - "apps/ios/**"
      - "docs/**"
      - "**/*.md"
      - ".github/workflows/ios*.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # api импортирует @lifeos/contracts из dist — собираем до типов и тестов.
      - run: pnpm --filter @lifeos/contracts build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase db start
      - run: supabase db reset --local
      - run: supabase test db
