name: iOS

# Сборка, тесты и скриншоты iOS на Mac-машине GitHub. Минута macOS съедает лимит
# примерно в 10 раз быстрее Linux, поэтому только по кнопке «Run workflow»
# (Actions → iOS) — когда нужны свежие скриншоты или проверка перед установкой.
on:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 26 (MLX требует Swift 6.2)
        run: |
          xc=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$xc" ]; then sudo xcode-select -s "$xc"; fi
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Pick a simulator
        id: sim
        run: |
          xcodebuild -version
          udid=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in sorted(d.items(), reverse=True) if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Build and run unit tests (без подписи)
        run: |
          set -o pipefail
          xcodebuild test \
            -resultBundlePath build/Tests.xcresult \
            -project Ealzy.xcodeproj \
            -scheme Ealzy \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E "error:|warning: .*Ealzy/|Test Case|TEST (SUCCEEDED|FAILED)|\*\* " || true
          grep -q "TEST SUCCEEDED" build.log
      - name: Скриншоты экранов (демо-данные)
        if: always()
        run: |
          mkdir -p build/screens
          xcrun xcresulttool export attachments --path build/Tests.xcresult --output-path build/screens || true
          ls build/screens | head -20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: apps/ios/build/screens
          if-no-files-found: ignore
      - name: Report compiler errors
        if: failure()
        # Логи запусков из сессии Claude не скачиваются — выводим ошибки аннотациями.
        run: |
          grep -E "error:|Failed|XCTAssert" build.log | sort -u | head -10 | while IFS= read -r line; do
            echo "::error::${line}"
          done || true
