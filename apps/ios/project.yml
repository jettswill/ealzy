name: Ealzy
options:
  bundleIdPrefix: ru.ealzy
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ru
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  Ealzy:
    type: application
    platform: iOS
    sources:
      - Ealzy
    info:
      path: Ealzy/Info.plist
      properties:
        CFBundleDisplayName: Ealzy
        CFBundleDevelopmentRegion: ru
        CFBundleURLTypes:
          - CFBundleURLName: ru.ealzy.app
            CFBundleURLSchemes: [ealzy]
        LSApplicationQueriesSchemes: [tg]
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [ru.ealzy.app.refresh]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.ealzy.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
  EalzyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - EalzyTests
    dependencies:
      - target: Ealzy
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Ealzy:
    build:
      targets:
        Ealzy: all
        EalzyTests: [test]
    test:
      targets:
        - EalzyTests
