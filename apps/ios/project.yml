name: Ealzy
options:
  bundleIdPrefix: ru.ealzy
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ru
packages:
  # 3.31.4 + mlx-swift 0.31.4 собираются в Xcode 26.3 (CI); версии новее требуют Swift 6.3.
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 3.31.4
  MLXSwift:
    url: https://github.com/ml-explore/mlx-swift
    exactVersion: 0.31.4
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.4.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "3"
    DEVELOPMENT_TEAM: ""
    # Свой идентификатор можно подставить при сборке (бесплатная учётка Apple — scripts/install-on-iphone.command).
    EALZY_BUNDLE_ID: ru.ealzy.app
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Ealzy:
    type: application
    platform: iOS
    sources:
      - Ealzy
    dependencies:
      - target: EalzyWidget
      - target: EalzyShare
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: MLXSwift
        product: MLX
      - package: SwiftTransformers
        product: Tokenizers
    info:
      path: Ealzy/Info.plist
      properties:
        CFBundleDisplayName: Ealzy
        CFBundleDevelopmentRegion: ru
        CFBundleURLTypes:
          - CFBundleURLName: ru.ealzy.app
            CFBundleURLSchemes: [ealzy]
        LSApplicationQueriesSchemes: [tg]
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        UIApplicationSupportsIndirectInputEvents: true
        NSSupportsLiveActivities: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [fetch, remote-notification]
        BGTaskSchedulerPermittedIdentifiers: [ru.ealzy.app.refresh]
        ITSAppUsesNonExemptEncryption: false
        EalzyKeychainGroup: $(AppIdentifierPrefix)ru.ealzy.shared
        NSCalendarsFullAccessUsageDescription: Илзи видит твои встречи и тренировки, чтобы планировать день вокруг них и ставить дела в календарь.
        NSCalendarsUsageDescription: Илзи видит твои встречи и тренировки, чтобы планировать день вокруг них.
        NSCalendarsWriteOnlyAccessUsageDescription: Илзи ставит дела в твой календарь, чтобы они были видны на iPhone и компьютере.
        NSMicrophoneUsageDescription: Чтобы надиктовывать Илзи дела и мысли голосом.
        NSSpeechRecognitionUsageDescription: Чтобы превращать надиктованное в текст — по возможности прямо на iPhone.
        NSRemindersFullAccessUsageDescription: Чтобы перенести открытые напоминания в Ealzy одной кнопкой.
        NSRemindersUsageDescription: Чтобы перенести открытые напоминания в Ealzy одной кнопкой.
        NSLocationWhenInUseUsageDescription: Чтобы показывать погоду там, где ты, искать места рядом и чтобы Илзи знала, в каком ты городе. Илзи хранит только город, точная точка остаётся на iPhone.
    entitlements:
      path: Ealzy/Ealzy.entitlements
      properties:
        aps-environment: development
        com.apple.security.application-groups: [group.ru.ealzy.app]
        keychain-access-groups: [$(AppIdentifierPrefix)ru.ealzy.shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(EALZY_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  EalzyWidget:
    type: app-extension
    platform: iOS
    sources:
      - EalzyWidget
      - Ealzy/Shared
      - Ealzy/Design
    info:
      path: EalzyWidget/Info.plist
      properties:
        CFBundleDisplayName: Ealzy
        EalzyKeychainGroup: $(AppIdentifierPrefix)ru.ealzy.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: EalzyWidget/EalzyWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.ru.ealzy.app]
        keychain-access-groups: [$(AppIdentifierPrefix)ru.ealzy.shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(EALZY_BUNDLE_ID).widget
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SKIP_INSTALL: YES

  EalzyShare:
    type: app-extension
    platform: iOS
    sources:
      - EalzyShare
      - Ealzy/Shared
    info:
      path: EalzyShare/Info.plist
      properties:
        CFBundleDisplayName: Ealzy
        EalzyKeychainGroup: $(AppIdentifierPrefix)ru.ealzy.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    entitlements:
      path: EalzyShare/EalzyShare.entitlements
      properties:
        com.apple.security.application-groups: [group.ru.ealzy.app]
        keychain-access-groups: [$(AppIdentifierPrefix)ru.ealzy.shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(EALZY_BUNDLE_ID).share
        SKIP_INSTALL: YES

  EalzyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - EalzyTests
    dependencies:
      - target: Ealzy
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  EalzyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - EalzyUITests
    dependencies:
      - target: Ealzy
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Ealzy
schemes:
  Ealzy:
    build:
      targets:
        Ealzy: all
        EalzyTests: [test]
        EalzyUITests: [test]
    test:
      targets:
        - EalzyTests
        - EalzyUITests
