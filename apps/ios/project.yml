name: Ealzy
options:
  bundleIdPrefix: ru.ealzy
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ru
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Ealzy:
    type: application
    platform: iOS
    sources:
      - Ealzy
    dependencies:
      - target: EalzyWidget
      - target: EalzyShare
    info:
      path: Ealzy/Info.plist
      properties:
        CFBundleDisplayName: Ealzy
        CFBundleDevelopmentRegion: ru
        CFBundleURLTypes:
          - CFBundleURLName: ru.ealzy.app
            CFBundleURLSchemes: [ealzy]
        LSApplicationQueriesSchemes: [tg]
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [fetch, remote-notification]
        BGTaskSchedulerPermittedIdentifiers: [ru.ealzy.app.refresh]
        ITSAppUsesNonExemptEncryption: false
        EalzyKeychainGroup: $(AppIdentifierPrefix)ru.ealzy.shared
        NSCalendarsFullAccessUsageDescription: Илзи видит твои встречи и тренировки, чтобы планировать день вокруг них и ставить дела в календарь.
        NSCalendarsUsageDescription: Илзи видит твои встречи и тренировки, чтобы планировать день вокруг них.
        NSCalendarsWriteOnlyAccessUsageDescription: Илзи ставит дела в твой календарь, чтобы они были видны на iPhone и компьютере.
        NSRemindersFullAccessUsageDescription: Чтобы перенести открытые напоминания в Ealzy одной кнопкой.
        NSRemindersUsageDescription: Чтобы перенести открытые напоминания в Ealzy одной кнопкой.
    entitlements:
      path: Ealzy/Ealzy.entitlements
      properties:
        aps-environment: development
        com.apple.security.application-groups: [group.ru.ealzy.app]
        keychain-access-groups: [$(AppIdentifierPrefix)ru.ealzy.shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.ealzy.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  EalzyWidget:
    type: app-extension
    platform: iOS
    sources:
      - EalzyWidget
      - Ealzy/Shared
    info:
      path: EalzyWidget/Info.plist
      properties:
        CFBundleDisplayName: Ealzy
        EalzyKeychainGroup: $(AppIdentifierPrefix)ru.ealzy.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: EalzyWidget/EalzyWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.ru.ealzy.app]
        keychain-access-groups: [$(AppIdentifierPrefix)ru.ealzy.shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.ealzy.app.widget
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SKIP_INSTALL: YES

  EalzyShare:
    type: app-extension
    platform: iOS
    sources:
      - EalzyShare
      - Ealzy/Shared
    info:
      path: EalzyShare/Info.plist
      properties:
        CFBundleDisplayName: Ealzy
        EalzyKeychainGroup: $(AppIdentifierPrefix)ru.ealzy.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    entitlements:
      path: EalzyShare/EalzyShare.entitlements
      properties:
        com.apple.security.application-groups: [group.ru.ealzy.app]
        keychain-access-groups: [$(AppIdentifierPrefix)ru.ealzy.shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.ealzy.app.share
        SKIP_INSTALL: YES

  EalzyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - EalzyTests
    dependencies:
      - target: Ealzy
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Ealzy:
    build:
      targets:
        Ealzy: all
        EalzyTests: [test]
    test:
      targets:
        - EalzyTests
