server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  etag off;

  gzip on;
  gzip_vary on;
  gzip_min_length 256;
  gzip_comp_level 5;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location = /sw.js {
    default_type application/javascript;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Service-Worker-Allowed "/" always;
    try_files /sw.js =404;
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
    try_files /manifest.webmanifest =404;
  }

  location = /version.json {
    default_type application/json;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Access-Control-Allow-Origin "*" always;
    try_files /version.json =404;
  }

  location = /precache.json {
    default_type application/json;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Access-Control-Allow-Origin "*" always;
    try_files /precache.json =404;
  }

  location = /boot-fallback.js {
    default_type application/javascript;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Access-Control-Allow-Origin "*" always;
    try_files /boot-fallback.js =404;
  }

  location = /assets/app.css {
    default_type text/css;
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files /assets/app.css =404;
  }

  # iOS probes these paths and treats SPA HTML as a missing icon.
  location ~* ^/(apple-touch-icon.*|icon-\d+)\.png$ {
    default_type image/png;
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public, max-age=604800" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location ~* ^/assets/.+\.js$ {
    try_files $uri @stale-js;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Stale hashed JS must load the current release, not bounce the page.
  location @stale-js {
    default_type application/javascript;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Access-Control-Allow-Origin "*" always;
    try_files /boot-fallback.js =404;
  }

  location ~* ^/assets/.+\.css$ {
    try_files $uri @stale-css;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location @stale-css {
    default_type text/css;
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files /assets/app.css =404;
  }

  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, must-revalidate" always;
  }
}
